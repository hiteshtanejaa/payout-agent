<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treasurer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F4; --surface:#FFFFFF; --ink:#17211D; --muted:#66706B; --faint:#98A19C; --line:#E2E5E1;
  --brand:#1D4A3A; --brand-ink:#EAF2EE;
  --ok:#1E7047; --ok-bg:#E5F3EB; --wait:#8F5B00; --wait-bg:#FBF0D9;
  --hold:#4A4CA0; --hold-bg:#ECECF9; --no:#B42318; --no-bg:#FCEBE9; --cap:#1D4A3A; --cap-bg:#E3ECE8;
  --radius:10px;
  --sans:"Schibsted Grotesk",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);font-feature-settings:"tnum" 1}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 64px}
header{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink);font-weight:700}
header h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
header .ver{color:var(--faint);font:12px var(--mono)}
header .spacer{flex:1}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#C9CEC9}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:#163a2d}
.btn[disabled]{opacity:.5;cursor:progress}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:rgba(255,255,255,.2);font-size:12px}

.top{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-bottom:28px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.spend .label{color:var(--muted);font-size:13px}
.big{font-size:40px;font-weight:600;letter-spacing:-.02em;margin:2px 0 14px}
.big sup,.amt sup{font-size:.5em;vertical-align:.75em;margin-left:1px;font-weight:500}
.meter{height:8px;background:#ECEFEC;border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .4s}
.meter-cap{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:8px}
.strip{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:14px}
.strip b{font-weight:600}

.cardside{display:grid;grid-template-columns:170px 1fr;gap:20px;align-items:center}
.plastic{aspect-ratio:1.586;border-radius:12px;padding:14px 16px;color:#E9F1EC;position:relative;overflow:hidden;
  background:
    repeating-radial-gradient(circle at 115% -10%, rgba(255,255,255,.07) 0 1px, transparent 1px 7px),
    repeating-radial-gradient(circle at -20% 120%, rgba(255,255,255,.05) 0 1px, transparent 1px 9px),
    linear-gradient(140deg,#24594A,#163B2F 60%,#10302A);
  box-shadow:0 10px 24px -14px rgba(16,48,42,.7)}
.plastic .chip{width:28px;height:21px;border-radius:4px;background:linear-gradient(135deg,#D9C58E,#A88E4F);margin-top:16px}
.plastic .num{position:absolute;left:16px;bottom:30px;font:13px var(--mono);letter-spacing:.08em}
.plastic .who{position:absolute;left:16px;bottom:12px;font-size:11px;opacity:.8}
.plastic .tag{position:absolute;right:14px;top:12px;font-size:11px;opacity:.8}
.limits{margin:0;font-size:13px}
.limits div{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.limits div:last-child{border:0}
.limits dt{color:var(--muted)}
.limits dd{margin:0;text-align:right;font-weight:500}
.enf{display:block;font-weight:400;color:var(--faint);font-size:12px;white-space:nowrap}

h2{font-size:17px;font-weight:600;margin:0 0 12px;letter-spacing:-.005em}
section{margin-bottom:28px}
.pending{display:grid;gap:10px}
.pitem{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--wait);border-radius:var(--radius);padding:14px 18px}
.pitem.held{border-left-color:var(--hold)}
.pitem .what{font-weight:600}
.pitem .why{color:var(--muted);font-size:13.5px;margin-top:2px;max-width:72ch}
.pitem .note{margin-top:6px;font-size:13.5px;background:var(--hold-bg);color:#2E3080;border-radius:6px;padding:6px 10px;max-width:72ch}
.approve{display:flex;gap:8px;align-items:center}
.approve input{width:120px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff}
.empty{color:var(--muted);font-size:14px;padding:14px 18px;border:1px dashed var(--line);border-radius:var(--radius)}

table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:10px 14px;border-bottom:1px solid var(--line);background:#FAFBFA}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:#FAFBFA}
td.r,th.r{text-align:right}
.amt{font-weight:500;white-space:nowrap}
.sub{color:var(--faint);font-size:12.5px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.p-approve{background:var(--ok-bg);color:var(--ok)} .p-escalate{background:var(--wait-bg);color:var(--wait)}
.p-hold{background:var(--hold-bg);color:var(--hold)} .p-decline{background:var(--no-bg);color:var(--no)}
.p-captured{background:var(--cap-bg);color:var(--cap)}
.cl{display:inline-block;font:12px var(--mono);padding:1px 6px;border-radius:5px;background:#F0F2F0;color:#45504A;margin:0 3px 3px 0}
.cl.fail{background:var(--no-bg);color:var(--no)}
.sid{font:12px var(--mono);color:var(--brand);text-decoration:none;border-bottom:1px solid #BFD2C8}
.sid:hover{border-color:var(--brand)}
tr.detail td{background:#FAFBFA;font-size:13.5px;color:#3A4540}
.detail dl{display:grid;grid-template-columns:170px 1fr;gap:6px 16px;margin:4px 0}
.detail dt{color:var(--muted)} .detail dd{margin:0}

.ask{display:flex;gap:10px}
.ask input{flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 16px;background:#fff}
.answer{margin-top:14px;display:grid;gap:12px}
.answer .block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;white-space:pre-wrap;font-size:14px;max-width:none}
.answer .src{font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
details.log{margin-top:6px}
details.log summary{cursor:pointer;color:var(--muted);font-size:13.5px}
details.log pre{background:#13201B;color:#D7E5DD;border-radius:var(--radius);padding:14px 16px;font:12.5px/1.55 var(--mono);overflow:auto;max-height:280px;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* "Ask why" answer: verdict, reason, evidence, rules, timeline (pattern: Copperx transaction details) */
.why{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;display:grid;gap:20px;animation:whyIn .35s ease both}
@keyframes whyIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.verdict{display:flex;gap:14px;align-items:center}
.vicon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.vicon svg{width:20px;height:20px}
.v-ok{background:var(--ok-bg);color:var(--ok)} .v-no{background:var(--no-bg);color:var(--no)}
.v-hold{background:var(--hold-bg);color:var(--hold)} .v-wait{background:var(--wait-bg);color:var(--wait)}
.verdict h3{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.verdict .when{color:var(--muted);font-size:13.5px;margin-top:2px}
.reason{margin:0;font-size:15px;line-height:1.55;max-width:72ch;color:#2A3530}
.why-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kv{background:#FAFBFA;border:1px solid var(--line);border-radius:8px;padding:4px 16px}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv div:last-child{border:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.kv .mono{font:12.5px var(--mono)}
.rules{list-style:none;margin:0;padding:4px 16px;background:#FAFBFA;border:1px solid var(--line);border-radius:8px}
.rules li{display:grid;grid-template-columns:20px 30px 1fr;gap:6px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rules li:last-child{border:0}
.rules .mk{font-weight:700} .rules .pass .mk{color:var(--ok)} .rules .fail .mk{color:var(--no)} .rules .hold .mk{color:var(--hold)} .rules .wait .mk{color:var(--wait)}
.rules .cid{font:12px var(--mono);color:var(--muted)}
.rules .fail .why-rule{display:block;color:var(--no);font-size:13px;margin-top:2px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative;padding:0 0 14px 22px;font-size:14px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:4px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--brand)}
.tl li::after{content:"";position:absolute;left:7px;top:16px;bottom:-2px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.no::before{background:var(--no)} .tl li.hold::before{background:var(--hold)} .tl li.wait::before{background:var(--wait)}
.tl .t{color:var(--faint);font-size:12.5px;margin-left:6px}
.sec-title{font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:500}
.memq{border-left:3px solid var(--brand);padding:2px 0 2px 14px;color:#2A3530;font-size:14.5px;white-space:pre-wrap;max-width:80ch}
.memnote{font-size:13px;color:var(--faint)}
details.raw summary{cursor:pointer;color:var(--muted);font-size:13px}
details.raw pre{white-space:pre-wrap;font:12px/1.5 var(--mono);color:#45504A;background:#FAFBFA;border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0 0}
@media (max-width:860px){.why-grid{grid-template-columns:1fr}}
/* inbox picker */
.inbox-wrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:min(440px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 18px 40px -18px rgba(23,33,29,.35);z-index:20;opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .16s ease,transform .16s ease}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;font-weight:600}
.pop-head label{font-weight:400;font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.mail{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer}
.mail:hover{background:#FAFBFA}
.mail input,.pop-head input{accent-color:var(--brand);width:16px;height:16px;margin:2px 0 0}
.mail .from{font-size:12.5px;color:var(--muted)}
.mail .subj{font-weight:500;font-size:14px}
.mail > div{min-width:0}
.mail .snip{font-size:13px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.pop-empty{padding:16px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
/* live run strip (pattern: Wise's thin step bar) */
.run{margin-bottom:28px}
.run .panel{padding:16px 22px 14px}
.run-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:12px}
.run-title{font-weight:600}
.run-title .sub{font-weight:400;margin-left:8px}
.run-state{font-size:13.5px;color:var(--muted);transition:color .3s,opacity .25s}
.run .panel > *{transition:opacity .2s ease}
.run .panel.fade > *{opacity:0}
.run-state.ok{color:var(--ok)} .run-state.no{color:var(--no)} .run-state.hold{color:var(--hold)} .run-state.wait{color:var(--wait)}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.seg{height:4px;border-radius:2px;background:#E8EBE8;position:relative;overflow:hidden}
.seg i{position:absolute;inset:0;transform:scaleX(0);transform-origin:left;background:var(--brand);transition:transform .55s cubic-bezier(.4,0,.2,1),background .3s}
.steps.reset .seg i{transition:none}
.st.done .seg i{transform:scaleX(1)}
.st.fail .seg i{transform:scaleX(1);background:var(--no)}
.st.hold .seg i{transform:scaleX(1);background:var(--hold)}
.st.wait .seg i{transform:scaleX(1);background:var(--wait)}
.st.skip .seg{background:repeating-linear-gradient(90deg,#E8EBE8 0 4px,transparent 4px 7px)}
.st.active .seg::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(29,74,58,.55),transparent);animation:sweep 1.1s ease-in-out infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.st .lbl{font-size:12px;color:var(--faint);margin-top:7px;transition:color .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.done .lbl,.st.active .lbl{color:var(--ink)} .st.fail .lbl{color:var(--no)} .st.hold .lbl{color:var(--hold)} .st.wait .lbl{color:var(--wait)}
tr.enter td{animation:enter .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(-6px);background:#EEF6F1}60%{background:#EEF6F1}to{opacity:1;transform:none;background:transparent}}
.plastic{transition:box-shadow .3s,transform .3s}
.plastic.tap-ok{animation:tapok 1.1s ease}
.plastic.tap-no{animation:tapno 1.1s ease}
@keyframes tapok{0%{box-shadow:0 0 0 0 rgba(30,112,71,.55),0 10px 24px -14px rgba(16,48,42,.7)}40%{transform:translateY(-2px)}100%{box-shadow:0 0 0 14px rgba(30,112,71,0),0 10px 24px -14px rgba(16,48,42,.7);transform:none}}
@keyframes tapno{0%{box-shadow:0 0 0 0 rgba(180,35,24,.55)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}100%{box-shadow:0 0 0 14px rgba(180,35,24,0);transform:none}}
@media (max-width:860px){.st .lbl{font-size:10.5px}}
@media (max-width:860px){header .ver{display:none}.top{grid-template-columns:1fr}.cardside{grid-template-columns:1fr}.plastic{max-width:280px}
  .hide-sm{display:none}.wrap{padding:20px 16px 48px}.pitem{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">T</div>
    <h1>Treasurer</h1>
    <span class="ver" id="ver"></span>
    <span class="spacer"></span>
    <div class="inbox-wrap">
      <button class="btn primary" id="runInbox" aria-haspopup="dialog" aria-expanded="false">Process inbox<span class="count" id="inboxCount">0</span></button>
      <div class="pop" id="inboxPop" role="dialog" aria-label="Choose emails to process">
        <div class="pop-head"><span>Inbox</span><label><input type="checkbox" id="selAll" checked> Select all</label></div>
        <div id="mailList"></div>
        <div class="pop-foot"><button class="btn" id="popCancel" type="button">Cancel</button><button class="btn primary" id="popGo" type="button">Process selected</button></div>
      </div>
    </div>
  </header>

  <div class="top">
    <div class="panel spend">
      <div class="label">Card spend this month</div>
      <div class="big" id="spent">£0</div>
      <div class="meter" role="progressbar" aria-label="Monthly spend against cap" id="meterWrap"><i id="meter" style="width:0"></i></div>
      <div class="meter-cap"><span id="left"></span><span id="cap"></span></div>
      <div class="strip" id="strip"></div>
    </div>
    <div class="panel cardside">
      <div class="plastic" id="plastic" aria-label="Treasurer virtual card">
        <div class="tag">Virtual · GBP</div>
        <div class="chip"></div>
        <div class="num" id="last4">•••• ••••</div>
        <div class="who">Treasurer Agent</div>
      </div>
      <dl class="limits" id="limits"></dl>
    </div>
  </div>

  <div class="run" id="run" aria-live="polite">
    <div class="panel">
      <div class="run-head"><div class="run-title" id="runTitle">Live activity</div><div class="run-state" id="runState">Waiting for requests</div></div>
      <div class="steps" id="steps"></div>
    </div>
  </div>

  <section>
    <h2>Needs a person</h2>
    <div class="pending" id="pending"></div>
  </section>

  <section>
    <h2>Every decision</h2>
    <table>
      <thead><tr><th>Time</th><th>Merchant</th><th>Outcome</th><th class="hide-sm">Clauses</th><th class="hide-sm">Decided by</th><th class="hide-sm">Stripe</th><th class="r">Amount</th></tr></thead>
      <tbody id="ledger"><tr><td colspan="7" class="sub">Loading…</td></tr></tbody>
    </table>
    <details class="log" id="logBox"><summary>Last run output</summary><pre id="log">Nothing run yet.</pre></details>
  </section>

  <section>
    <h2>Ask why</h2>
    <form class="ask" id="askForm">
      <input id="q" placeholder="Why did you pay Google Ads £350?" aria-label="Question about a decision">
      <button class="btn primary" id="askBtn">Ask</button>
    </form>
    <div class="answer" id="answer"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = p => { p = Math.round(+p || 0); const neg = p < 0; p = Math.abs(p);
  return `${neg ? "−" : ""}£${Math.floor(p/100).toLocaleString("en-GB")}<sup>.${String(p%100).padStart(2,"0")}</sup>`; };
const plain = p => "£" + (Math.round(+p||0)/100).toLocaleString("en-GB",{maximumFractionDigits:0});
const OUT = {approve:["Approved","approve"], escalate:["Needs approval","escalate"], hold:["Held","hold"],
             decline:["Declined","decline"], captured:["Captured","captured"]};
const STAGE = {proposal:"Proposed", approval:"Approval", authorization:"Card authorization", capture:"Settled", extraction:"Email read"};
const CAT = {computer_software_stores:"Software", computers_peripherals_and_software:"Computers",
             office_and_commercial_furniture:"Office furniture", advertising_services:"Advertising"};
let S = null, seen = new Set(), open = new Set(), first = true;

function who(d){
  const b = d.decided_by || "";
  if (b === "policy_evaluator") return "Policy";
  if (b === "treasurer_webhook") return "Card gate";
  if (b.startsWith("human:")) return b.slice(6);
  if (b.startsWith("stripe")) return "Stripe";
  if (b === "extractor") return "Email reader";
  return b;
}
function stripeLink(st){
  st = st || {};
  if (st.transaction_id) return `<a class="sid" target="_blank" rel="noopener" href="https://dashboard.stripe.com/test/issuing/transactions/${esc(st.transaction_id)}">${esc(st.transaction_id.slice(0,14))}…</a>`;
  if (st.authorization_id) return `<a class="sid" target="_blank" rel="noopener" href="https://dashboard.stripe.com/test/issuing/authorizations/${esc(st.authorization_id)}">${esc(st.authorization_id.slice(0,14))}…</a>`;
  return `<span class="sub">—</span>`;
}
function clauses(d){
  const t = id => esc((S.policy.clauses[id]||{}).title || "");
  let h = (d.clause_ids||[]).map(c => `<span class="cl ${c===d.failed_clause?"fail":""}" title="${t(c)}">${esc(c)}</span>`).join("");
  if (d.failed_clause && !(d.clause_ids||[]).includes(d.failed_clause)) h += `<span class="cl fail">${esc(d.failed_clause)}</span>`;
  return h || `<span class="sub">—</span>`;
}
function detail(d){
  const ev = d.evidence || {}, rows = [];
  const add = (k,v) => v !== undefined && v !== null && v !== "" && rows.push(`<dt>${k}</dt><dd>${v}</dd>`);
  add("Stage", esc(STAGE[d.stage] || d.stage));
  if (d.failed_clause) add("Stopped by", `<b>${esc(d.failed_clause)}</b> ${esc((S.policy.clauses[d.failed_clause]||{}).rule || "")}`);
  if (ev.origin) add("Request", esc(`${ev.origin.file || ""} · read by ${ev.origin.parsed_by || ""}`));

// ---------- motion: everything below is driven by real ledger rows, never by timers
let shown = 0;
function countTo(target){
  const el = $("spent"), from = shown, t0 = performance.now(), dur = 700;
  if (from === target || matchMedia("(prefers-reduced-motion: reduce)").matches){ shown = target; el.innerHTML = money(target); return; }
  shown = target;
  (function tick(t){ const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3);
    el.innerHTML = money(from + (target-from)*e); if (k < 1) requestAnimationFrame(tick); })(t0);
}
function tap(ok){
  const c = $("plastic"); c.classList.remove("tap-ok","tap-no"); void c.offsetWidth; c.classList.add(ok ? "tap-ok" : "tap-no");
}
const STEPS = [["read","Request read"],["memory","Memory check"],["policy","Policy"],["approve","Approver"],["gate","Card gate"],["settled","Settled"]];
const DWELL = 1400;            // a finished request stays readable this long before the next one takes over
let queue = [], current = null, doneAt = 0, painted = null;
$("steps").innerHTML = STEPS.map(([k,l]) => `<div class="st"><div class="seg"><i></i></div><div class="lbl">${l}</div></div>`).join("");

function keyOf(d){
  if (d.intent_id) return "i:" + d.intent_id;
  const aid = (d.stripe || {}).authorization_id;
  if (aid){
    const a = S.decisions.find(x => x.stage === "authorization" && (x.stripe||{}).authorization_id === aid && x.intent_id);
    return a ? "i:" + a.intent_id : "a:" + aid;
  }
  return "a:" + d.decision_id;
}
function onNew(list){
  for (const d of list){
    if (d.stage === "authorization") setTimeout(() => tap(d.decision === "approve"), current === keyOf(d) ? 0 : 400);
    const k = keyOf(d);
    if (k !== current && !queue.includes(k)) queue.push(k);
  }
  drawRun();
}
function startRun(k){ queue = []; show(k); }   // a button press jumps straight to what was pressed
function show(k){ current = k; doneAt = 0; drawRun(); }

function view(k){
  const ds = S ? S.decisions : [];
  const st = Object.fromEntries(STEPS.map(([s]) => [s,"todo"]));
  let title = "Processing inbox", state = ["Reading the request…",""];
  if (k && k.startsWith("i:")){
    const id = k.slice(2), mine = ds.filter(d => d.intent_id === id);
    const auths = new Set(mine.map(d => (d.stripe||{}).authorization_id).filter(Boolean));
    const cap = ds.find(d => d.stage === "capture" && auths.has((d.stripe||{}).authorization_id));
    const prop = mine.find(d => d.stage === "proposal"), appr = [...mine].reverse().find(d => d.stage === "approval");
    const auth = [...mine].reverse().find(d => d.stage === "authorization");
    const it = ((S && S.intents) || []).find(i => i.id === id) || prop || {};
    if (it.merchant) title = `${esc(it.merchant)} <span class="sub">${plain(it.amount)}</span>`;
    if (prop){
      st.read = "done"; state = ["Checking policy…",""];
      const mem = (prop.evidence || {}).memory;
      st.memory = !mem ? "skip" : (mem.status === "clear" ? "done" : "hold");
      if (prop.decision === "decline"){ st.policy = "fail"; state = ["Declined · " + prop.failed_clause, "no"]; }
      else if (prop.decision === "hold"){ st.policy = "hold"; state = ["Held · memory flagged this merchant", "hold"]; }
      else {
        st.policy = "done"; state = ["Paying with the card…",""];
        if (!(prop.clause_ids || []).includes("C3")) st.approve = "skip";
        else if (appr && appr.decision === "approve") st.approve = "done";
        else { st.approve = "wait"; state = ["Waiting for an approver · C3", "wait"]; }
      }
    }
    if (auth){ st.gate = auth.decision === "approve" ? "done" : "fail";
      state = auth.decision === "approve" ? ["Card gate approved · settling…", ""] : ["Card gate declined · " + auth.failed_clause, "no"]; }
    if (cap){ st.settled = "done"; state = ["Paid", "ok"]; }
  } else if (k && k.startsWith("a:")){
    const id = k.slice(2), d = [...ds].reverse().find(x => (x.stripe||{}).authorization_id === id || x.decision_id === id) || {};
    title = `${esc(d.merchant || "Card charge")} <span class="sub">${plain(d.amount)} · not proposed by Treasurer</span>`;
    ["read","memory","policy","approve"].forEach(s => st[s] = "skip");
    st.gate = d.decision === "approve" ? "done" : "fail";
    state = d.decision === "approve" ? ["Approved","ok"] :
      ((d.decided_by || "").startsWith("stripe:") ? ["Blocked by Stripe before our code ran","no"] : ["Declined · " + (d.failed_clause || ""),"no"]);
  }
  const finished = ["ok","no","hold","wait"].includes(state[1]);
  if (!finished){ const s = STEPS.map(([x]) => x).find(x => st[x] === "todo"); if (s) st[s] = "active"; }
  return {title, state, st, finished};
}

function paint(v){
  $("runTitle").innerHTML = v.title;
  const rs = $("runState"); rs.textContent = v.state[0]; rs.className = "run-state " + v.state[1];
  STEPS.forEach(([k], i) => { const el = $("steps").children[i], c = "st " + v.st[k]; if (el.className !== c) el.className = c; });
}
function drawRun(){
  if (!current){ if (queue.length) show(queue.shift()); return; }
  let v = view(current);
  if (v.finished && painted === current && !doneAt) doneAt = performance.now();
  // move on only when this request has finished and its outcome has been readable for a moment
  if (queue.length && (current === "pending" || (doneAt && performance.now() - doneAt > DWELL))){
    current = queue.shift(); doneAt = 0; v = view(current);
  }
  const panel = $("run").firstElementChild;
  if (painted !== current){
    painted = current;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    panel.classList.add("fade");
    setTimeout(() => {           // fade out, reset the bar without animating, fade in, then let it fill forward
      $("steps").classList.add("reset");
      [...$("steps").children].forEach(el => el.className = "st");
      void $("steps").offsetWidth; $("steps").classList.remove("reset");
      paint(view(current)); panel.classList.remove("fade");
    }, reduce ? 0 : 200);
    return;
  }
  if (!panel.classList.contains("fade")) paint(v);
}
setInterval(() => { if (S) drawRun(); }, 250);

async function refresh(){
  try { S = await (await fetch("/api/state")).json(); render(); drawRun(); } catch(e) { /* server restarting; try again next tick */ }
}
function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); }
function showLog(s){ $("log").textContent = s || "(no output)"; $("logBox").open = true; }
async function post(url, body){
  async function request(target, options, polling = false){
    const controller = new AbortController(), timeout = setTimeout(() => controller.abort(), 15000);
    try {
      const r = await fetch(target, {...options, credentials:"same-origin", signal:controller.signal});
      if (polling && r.status === 404) throw new Error("Processing was interrupted or its status expired. Check the dashboard before submitting again.");
      if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
      return {status:r.status, data:await r.json()};
    } catch(err){
      if (err.name === "AbortError" || err instanceof TypeError){
        throw new Error(polling
          ? "Could not check processing status. The action may still be running; check the dashboard before submitting again."
          : "Could not confirm the request. It may have started; check the dashboard before submitting again.");
      }
      throw err;
    } finally { clearTimeout(timeout); }
  }
  const response = await request(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body||{})});
  if (response.status !== 202) return response.data;
  if (!response.data.job_id) throw new Error("The server did not return a processing ID. Check the dashboard before submitting again.");
  const jobUrl = `/api/jobs/${encodeURIComponent(response.data.job_id)}`;
  while (true){
    await new Promise(resolve => setTimeout(resolve, 1000));
    const {data:job} = await request(jobUrl, {method:"GET"}, true);
    if (job.status === "complete") return {...(job.result || {}), log:job.log || ""};
    if (job.status === "error") throw new Error([job.error || "Processing failed.", job.log].filter(Boolean).join("\n"));
    if (job.status !== "running") throw new Error("The server returned an unknown processing status. Check the dashboard before submitting again.");
  }
}

// ---------- "Ask why": turn ledger rows into a readable answer
const ICON = {
  ok:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 10.5l3.2 3L15 6.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  no:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l8 8M14 6l-8 8" stroke-linecap="round"/></svg>',
  hold:'<svg viewBox="0 0 20 20" fill="currentColor"><rect x="6" y="5" width="2.6" height="10" rx="1"/><rect x="11.4" y="5" width="2.6" height="10" rx="1"/></svg>',
  wait:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="6.5"/><path d="M10 6.5V10l2.5 1.6" stroke-linecap="round"/></svg>'};
const CNAME = {computer_software_stores:"Software", computers_peripherals_and_software:"Computers",
  office_and_commercial_furniture:"Office furniture", advertising_services:"Advertising", eating_places_restaurants:"Restaurants"};
const fmtWhen = ts => ts ? new Date(ts).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
const plainP = p => "£" + (Math.round(+p||0)/100).toLocaleString("en-GB",{minimumFractionDigits:2});

function whyGroups(recs){
  // one group per request: proposals/approvals/authorizations share an intent; captures join via the authorization
  const authToIntent = {}; recs.forEach(d => { const a = (d.stripe||{}).authorization_id; if (a && d.intent_id) authToIntent[a] = d.intent_id; });
  const groups = new Map();
  recs.forEach(d => { const k = d.intent_id || authToIntent[(d.stripe||{}).authorization_id] || "a:" + ((d.stripe||{}).authorization_id || d.decision_id);
    if (!groups.has(k)) groups.set(k, []); groups.get(k).push(d); });
  return [...groups.values()];
}

function whyCard(g){
  const P = S.policy, by = st => [...g].reverse().find(d => d.stage === st);
  const prop = by("proposal"), appr = by("approval"), auth = by("authorization"), cap = by("capture");
  const base = prop || auth || g[0], amt = base.amount, m = esc(base.merchant || "this charge");
  const ev = (appr || prop || auth || {}).evidence || {};
  let tone, head;
  if (cap || (auth && auth.decision === "approve")) { tone = "ok"; head = `Paid ${plainP(amt)} to ${m}`; }
  else if (auth && auth.decision !== "approve") { tone = "no"; head = `Declined ${plainP(amt)} at ${m}`; }
  else if (prop && prop.decision === "hold") { tone = "hold"; head = `Held ${plainP(amt)} for ${m}`; }
  else if (prop && prop.decision === "decline") { tone = "no"; head = `Declined ${plainP(amt)} at ${m}`; }
  else if (prop && prop.decision === "escalate" && !(appr && appr.decision === "approve")) { tone = "wait"; head = `${plainP(amt)} to ${m} is waiting for approval`; }
  else { tone = "ok"; head = `Cleared ${plainP(amt)} for ${m}`; }

  // plain-English reason, built only from what the ledger recorded
  const cat = CNAME[base.category] || base.category, bits = [];
  const failed = (auth && auth.decision !== "approve" && auth.failed_clause) || (prop && prop.failed_clause && prop.decision !== "escalate" ? prop.failed_clause : null);
  if (!prop && auth) bits.push("Treasurer never proposed this charge, so there was no request to match it to.");
  const SAY = {
    C1: () => `It is over the ${plainP(P.per_transaction_max).replace(".00","")} per-purchase cap, so C1 declined it.`,
    C2: () => `${esc(cat)} isn’t an allowed category, so C2 declined it.`,
    C4: () => `It would take the month over the ${plainP(P.monthly_max).replace(".00","")} cap, so C4 declined it.`,
    C5: () => `Nothing matching it had been proposed and cleared, so the card gate declined it under C5.`,
    C7: () => `Memory flagged this merchant, so C7 held it before any money moved.`};
  if (failed && SAY[failed]) bits.push(SAY[failed]());
  else if (failed) bits.push(`It was stopped by ${esc(failed)}.`);
  if (prop && !failed){
    bits.push(`It was under the ${plainP(P.per_transaction_max).replace(".00","")} per-purchase cap, in an allowed category (${esc(cat)}), and within the monthly cap.`);
    const mem = (prop.evidence||{}).memory; if (mem && mem.status === "clear") bits.push("Finance notes in memory raised nothing about this merchant.");
  }
  if (prop && prop.decision === "hold"){ const mem = (prop.evidence||{}).memory || {}; if ((mem.notes||[]).length) bits.push(`Memory recalled: “${esc(mem.notes[0])}”`); }
  if (appr && appr.decision === "approve" && ev.approval) bits.push(`It was over ${plainP(P.escalate_above).replace(".00","")}, so ${esc(ev.approval.approver)} approved it.`);
  else if (tone === "wait") bits.push(`It is over ${plainP(P.escalate_above).replace(".00","")}, so a named approver has to sign it off first.`);
  if (auth && auth.decision === "approve") bits.push("At the card, the gate matched the charge to this cleared request.");
  if (cap) bits.push("Stripe then settled the payment.");

  // evidence panel
  const a = (auth || {}).stripe || {}, kv = [];
  const row = (k,v) => v && kv.push(`<div><dt>${k}</dt><dd>${v}</dd></div>`);
  const pillTxt = {ok:"Paid", no:"Declined", hold:"Held", wait:"Awaiting approval"}[tone], pillCls = {ok:"approve", no:"decline", hold:"hold", wait:"escalate"}[tone];
  row("Status", `<span class="pill p-${pillCls}">${tone === "ok" && !cap && !auth ? "Cleared" : pillTxt}</span>`);
  row("Amount", plainP(amt));
  row("Category", esc(cat));
  if (ev.approval) row("Approved by", `${esc(ev.approval.approver)} <span class="sub mono">${esc(ev.approval.token||"")}</span>`);
  const mtd = [...g].reverse().find(d => (d.evidence||{}).month_spent_after !== undefined);
  if (mtd && tone === "ok") row("Month to date", `${plainP(mtd.evidence.month_spent_after)} of ${plainP(mtd.evidence.monthly_max)}`);
  if (a.authorization_id) row("Card authorization", `<a class="sid" target="_blank" rel="noopener" href="https://dashboard.stripe.com/test/issuing/authorizations/${esc(a.authorization_id)}">${esc(a.authorization_id)}</a>`);
  if (cap && (cap.stripe||{}).transaction_id) row("Transaction", `<span class="mono">${esc(cap.stripe.transaction_id)}</span>`);
  row("Policy version", `<span class="mono">${esc((base.policy_version||"").replace("sha256:",""))}</span>`);

  // rules: every clause any stage applied, marked by the worst outcome it saw
  const order = ["C1","C2","C3","C4","C5","C7"], seen = {};
  g.forEach(d => (d.clause_ids||[]).forEach(c => { seen[c] = seen[c] || "pass"; }));
  g.forEach(d => { if (d.failed_clause && seen[d.failed_clause] !== undefined) {
      const st = d.decision === "hold" ? "hold" : d.decision === "escalate" ? "wait" : "fail";
      if (!(st === "wait" && appr && appr.decision === "approve")) seen[d.failed_clause] = st; } });
  const mark = {pass:"✓", fail:"✕", hold:"Ⅱ", wait:"…"};
  const rules = order.filter(c => seen[c]).map(c => `<li class="${seen[c]}"><span class="mk">${mark[seen[c]]}</span><span class="cid">${c}</span>
      <span>${esc(P.clauses[c].title)}${seen[c] === "fail" ? `<span class="why-rule">${esc(P.clauses[c].rule)}</span>` : ""}</span></li>`).join("");

  // timeline
  const who2 = d => d.decided_by === "policy_evaluator" ? "Policy" : d.decided_by === "treasurer_webhook" ? "Card gate" :
    (d.decided_by||"").startsWith("human:") ? d.decided_by.slice(6) : (d.decided_by||"").startsWith("stripe") ? "Stripe" : d.decided_by;
  const verb = d => ({approve:"approved", escalate:"asked for an approver", hold:"held it", decline:"declined", captured:"settled"}[d.decision] || d.decision);
  const tl = g.map(d => `<li class="${d.decision === "decline" ? "no" : d.decision === "hold" ? "hold" : d.decision === "escalate" ? "wait" : ""}">
      <b>${esc(STAGE[d.stage] || d.stage)}</b> · ${esc(who2(d))} ${esc(verb(d))}<span class="t">${esc(fmtWhen(d.ts))}</span></li>`).join("");

  return `<div class="verdict"><div class="vicon v-${tone}">${ICON[tone]}</div>
      <div><h3>${head}</h3><div class="when">${esc(fmtWhen(base.ts))}</div></div></div>
    <p class="reason">${bits.join(" ")}</p>
    <div class="why-grid">
      <div><div class="sec-title">Evidence</div><dl class="kv">${kv.join("")}</dl></div>
      <div><div class="sec-title">Rules checked</div><ul class="rules">${rules || '<li><span></span><span></span><span class="sub">No policy rules ran (Stripe decided first).</span></li>'}</ul>
        <div class="sec-title" style="margin-top:16px">What happened</div><ol class="tl">${tl}</ol></div>
    </div>`;
}

function renderWhy(r){
  const groups = whyGroups(r.records || []), parts = [];
  if (!groups.length) parts.push(`<div class="why"><p class="reason">No decisions match that question yet. Try naming the merchant, e.g. “Why did you pay Figma?”</p></div>`);
  else {
    const latest = groups[groups.length-1];
    let inner = whyCard(latest);
    if (r.memory) inner += `<div><div class="sec-title">From Cognee memory</div><div class="memq">${esc(r.memory)}</div></div>`;
    else if (r.memory_error) inner += `<div class="memnote">${/not found/i.test(r.memory_error)
        ? "Cognee hasn’t been given these decisions yet (run python agent.py sync-memory), so this answer comes from the audit ledger."
        : "Cognee memory was unavailable, so this answer comes from the audit ledger."}</div>`;
    if (groups.length > 1) inner += `<div class="memnote">${groups.length - 1} earlier request${groups.length > 2 ? "s" : ""} for the same merchant are in the decisions table.</div>`;
    inner += `<details class="raw"><summary>Raw audit entries</summary><pre>${esc(r.ledger || "")}</pre></details>`;
    parts.push(`<div class="why">${inner}</div>`);
  }
  $("answer").innerHTML = parts.join("");
}

$("askForm").onsubmit = async e => {
  e.preventDefault(); const q = $("q").value.trim() || $("q").placeholder;
  $("askBtn").disabled = true; $("answer").innerHTML = `<div class="why"><p class="reason sub">Checking memory and the audit ledger…</p></div>`;
  try {
    renderWhy(await post("/api/why", {question:q}));
  } catch(err){ $("answer").innerHTML = `<div class="why"><p class="reason">Couldn’t answer: ${esc(err)}</p></div>`; }
  $("askBtn").disabled = false;
};
refresh(); setInterval(refresh, 700);
</script>
</body>
</html>
